<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Cards</title>
    <meta name="author" content="Your Name" />
    <meta name="description" content="A flash card application for studying" />
    <meta name="keywords" content="study aids, flashcars, learning materials" />
    <link rel="icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./assets/css/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <h1 class="header__title">
          <a href="#home" class="header__link">Flash Cards</a>
        </h1>
        <nav class="nav">
          <ul class="nav__links">
            <li><a href="#home" class="nav__link">My Decks</a></li>
            <li><a href="#about" class="nav__link">About</a></li>
          </ul>
        </nav>
      </header>

      <main class="page__main-content">
        <section class="gallery" id="home-view">
          <h2 class="gallery__title">My Decks</h2>
          <ul class="gallery__list">
            <li>
              <button class="gallery__new-card-btn">+ New Deck</button>
            </li>
          </ul>
        </section>

        <section class="gallery" id="deck-view">
          <div class="gallery__header">
            <button type="button" class="gallery__back-btn">
              Back to Decks
            </button>
            <h2 class="gallery__title"></h2>
            <button type="button" class="gallery__practice-btn">
              Practice
            </button>
          </div>
          <div class="wrapping-row">
            <ul class="gallery__list wrapping-row__display-contents"></ul>
          </div>
          <div class="gallery__actions">
            <button
              type="button"
              class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
            >
              + New Card
            </button>
          </div>
        </section>

        <template id="card-template">
          <li class="card card_color_green">
            <a href="#" class="card__link"></a>
            <h3 class="card__title"></h3>
            <div class="card__row">
              <span class="card__count"></span>
              <button class="card__delete-btn" type="button"></button>
            </div>
          </li>
        </template>

        <template id="flashcard-template">
          <li class="card card_color_green">
            <h3 class="card__title"></h3>
            <div class="card__row">
              <button
                type="button"
                aria-label="Open deck"
                class="card__open-btn"
              ></button>
              <button
                type="button"
                aria-label="Delete deck"
                class="card__delete-btn"
              ></button>
            </div>
          </li>
        </template>

        <section class="carousel" id="carousel-view" hidden>
          <h2 class="carousel__title">
            <span class="carousel__title-deck"></span>
            <span class="carousel__title-count"></span>
          </h2>
          <div class="carousel__grid">
            <button
              class="carousel__btn carousel__btn_type_left"
              type="button"
            ></button>
            <div class="carousel__card">
              <p class="carousel__card-text"></p>
            </div>
            <button
              class="carousel__btn carousel__btn_type_right"
              type="button"
            ></button>
            <button
              class="carousel__btn carousel__btn_type_flip"
              type="button"
              aria-label="flip card"
            ></button>
          </div>
        </section>

        <section class="not-found" id="not-found-view" hidden>
          <h2 class="not-found__title">404</h2>
          <p class="not-found__message">Page not found</p>
          <a href="#home" class="not-found__link">Back to home</a>
        </section>
      </main>

      <footer class="footer">
        <p class="footer__text">&copy; 2024 Flash Cards App</p>
      </footer>
      <script src="./assets/js/index.js" type="module"></script>
    </div>
  </body>
</html>
